[project]
name = "molt-sports-pilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "blake3>=0.4",
  "pyarrow>=15",
  "requests>=2.31",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
